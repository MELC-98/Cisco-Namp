version: "3.8"

# ============================================================
# Cisco NAMP — Docker Compose
# ============================================================

services:
  # --- Frontend: Vue.js 3 + Nginx ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - namp-network
    restart: unless-stopped

  # --- Backend: Laravel 11 ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup-storage:/app/storage/backups
    networks:
      - namp-network
    restart: unless-stopped

  # --- Automation: Python FastAPI + Netmiko ---
  automation:
    build:
      context: ./automation
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8001"
    networks:
      - namp-network
    restart: unless-stopped

  # --- Database: PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cisco_namp}
      POSTGRES_USER: ${DB_USERNAME:-namp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - namp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-namp_user} -d ${DB_DATABASE:-cisco_namp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Cache/Queue: Redis 7 ---
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - namp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backup-storage:

networks:
  namp-network:
    driver: bridge
